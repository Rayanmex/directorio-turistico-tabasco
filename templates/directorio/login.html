{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Directorio Turístico</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background: linear-gradient(135deg, #7A1B3A 0%, #a32554 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .login-card .logo img {
    height: 60px;
  }
  .login-card h1 {
    color: #7A1B3A;
    font-size: 1.4rem;
    text-align: center;
    margin-bottom: .3rem;
  }
  .login-card p.sub {
    text-align: center;
    color: #666;
    font-size: .85rem;
    margin-bottom: 1.8rem;
  }
  .form-group {
    margin-bottom: 1rem;
  }
  .form-group label {
    display: block;
    font-size: .82rem;
    font-weight: 600;
    color: #555;
    margin-bottom: .35rem;
  }
  .form-group input {
    width: 100%;
    padding: .7rem .9rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: .95rem;
    font-family: inherit;
    transition: border-color .15s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #7A1B3A;
  }
  .btn-login {
    width: 100%;
    background: #7A1B3A;
    color: #fff;
    border: 0;
    padding: .8rem;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: .5rem;
    transition: background .15s;
  }
  .btn-login:hover {
    background: #5d142c;
  }
  .error {
    background: #fee;
    color: #c62828;
    padding: .6rem .8rem;
    border-radius: 4px;
    font-size: .85rem;
    margin-bottom: 1rem;
    border-left: 3px solid #c62828;
  }
  .footer {
    text-align: center;
    font-size: .75rem;
    color: #999;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <img src="{% static 'img/logos/b2logo.png' %}" alt="Logo">
  </div>

  <h1>Directorio Turístico</h1>
  <p class="sub">Acceso restringido</p>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required autofocus
             autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required
             autocomplete="current-password">
    </div>

    <button type="submit" class="btn-login">Iniciar sesión</button>
  </form>

  <div class="footer">
    Sistema interno de consulta
  </div>
</div>

</body>
</html>
